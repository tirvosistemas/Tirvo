<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="tirvo:formato" content="feed">
  <meta name="tirvo:slides" content="1">
  <title>P28: o sistema da nossa marca</title>
  <link rel="stylesheet" href="../stories/premium/base.css">
  <link rel="stylesheet" href="feed.css">
  <style>
    .peca { background: radial-gradient(620px 520px at 540px 640px, rgba(255, 85, 0, .12), transparent 70%), linear-gradient(180deg, #060607 0%, #09090b 50%, #060607 100%); }
    .rotulo.r { z-index: 4; left: 96px; top: 196px; }
    .feed .titulo { left: 92px; top: 240px; font-size: 84px; }
    .quadro { z-index: 4; left: 96px; top: 448px; width: 888px; display: grid; grid-template-columns: 1fr 1.25fr 1fr; gap: 14px; }
    .quadro > div { position: relative; padding: 24px 26px; }
    .quadro small { display: block; margin-bottom: 16px; font: 500 16px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--t3); }
    .quadro .largo { grid-column: 1 / -1; }
    .quadro .capa-link { display: block; width: 100%; border-radius: 10px; border: 1px solid rgba(255, 255, 255, .1); }
    .icones { display: flex; align-items: flex-end; gap: 22px; }
    .icones img { display: block; }
    .cores { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .cores i { height: 58px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, .14); }
    .cores + p { margin-top: 10px; font: 500 13px/1 var(--mono); letter-spacing: .06em; color: var(--t3); }
    .tipos { display: grid; gap: 6px; }
    .tipos span { font-size: 28px; font-weight: 640; letter-spacing: -.035em; }
    .tipos .s { font-family: var(--serif); font-style: italic; font-weight: 400; }
    .tipos .m { font-family: var(--mono); font-weight: 500; font-size: 22px; letter-spacing: 0; }
    .slogan { font-size: 27px; font-weight: 560; letter-spacing: -.02em; line-height: 1.25; color: var(--t2); }
    .slogan b { color: var(--t1); font-weight: 560; }
  </style>
</head>
<body>
  <!-- Somente peças reais da Tirvo: capa de link, favicon, paleta, fontes e slogan -->
  <main class="peca feed" data-n="1">
    <header class="cab"><span>tirvo<b>_</b> / vitrine</span><span class="num">a nossa marca</span></header>
    <svg class="regua" width="888" height="14"></svg>
    <p class="rotulo r"><i>//</i> identidade visual</p>
    <h1 class="titulo">O sistema da nossa<br>marca, <em>em uma tela.</em></h1>
    <div class="quadro">
      <div class="largo" data-frame="18,0,18,0" data-tone="branco"><small>capa de link · aplicação real</small><img class="capa-link" src="../../../marca/tirvo-capa-de-link.png" alt=""></div>
      <div data-frame="18,0,18,0" data-tone="branco"><small>ícone</small><span class="icones"><img src="../../../favicon.svg" width="84" height="84" alt=""><img src="../../../favicon.svg" width="48" height="48" alt=""><img src="../../../favicon.svg" width="16" height="16" alt=""></span></div>
      <div data-frame="18,0,18,0" data-tone="branco"><small>paleta</small><div class="cores"><i style="background:#09090b"></i><i style="background:#16161a"></i><i style="background:#ff5500"></i><i style="background:#a1a1aa"></i><i style="background:#fafafa"></i></div><p>#09090b · #ff5500 · #fafafa</p></div>
      <div data-frame="18,0,18,0" data-tone="branco"><small>tipografia</small><div class="tipos"><span>Geist</span><span class="s">Instrument Serif</span><span class="m">Geist Mono</span></div></div>
    </div>
    <footer class="rod"><span class="dica">@tirvotech</span><img class="logo" data-logo></footer>
  </main>
  <script src="slide.js"></script>
  <script src="../stories/premium/base.js"></script>
</body>
</html>
