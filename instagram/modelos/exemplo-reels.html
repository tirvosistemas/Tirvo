<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="tirvo:formato" content="reels">
  <meta name="tirvo:duracao" content="8">
  <title>Exemplo de Reels animado</title>
  <link rel="stylesheet" href="base.css">
  <style>
    /* Tudo o que importa fica na faixa central de 1080 x 1350, que aparece no feed */
    .centro { margin-block: auto; display: grid; justify-items: start; gap: 72px; }

    .mira { width: 300px; height: 300px; overflow: visible; }
    .mira .canto { fill: #f4f4f5; animation: fechar 1.2s var(--ease-out) both; }
    .mira .c1 { --x: -16px; --y: -16px; }
    .mira .c2 { --x: 16px; --y: -16px; }
    .mira .c3 { --x: -16px; --y: 16px; }
    .mira .c4 { --x: 16px; --y: 16px; }
    .mira .marca { fill: #f4f4f5; fill-opacity: .45; animation: surgir .6s .7s var(--ease-out) both; }
    .mira .ponto { transform-box: fill-box; transform-origin: center; animation: acender .5s 1.2s var(--ease-out) both; }

    @keyframes fechar { from { transform: translate(var(--x), var(--y)); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes surgir { from { opacity: 0; } to { opacity: 1; } }
    @keyframes acender { from { transform: scale(0); opacity: 0; } 60% { transform: scale(1.25); opacity: 1; } to { transform: scale(1); opacity: 1; } }

    [data-decodificar] { white-space: pre; }
    .titulo .cursor { animation: surgir 0s 3.5s both, piscar 1.06s steps(1, end) 3.5s infinite; }
    .rotulo { animation: surgir .8s 4.1s var(--ease-out) both; }
    .rodape { animation: surgir .8s .4s var(--ease-out) both; }
  </style>
</head>
<body>
  <main class="peca peca--vertical">
    <div class="centro">
      <svg class="mira" viewBox="0 0 100 100" aria-hidden="true">
        <defs><filter id="brilho" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="3.2"/></filter></defs>
        <path class="canto c1" d="M6.5 35.5V6.5H35.5V13.5H13.5V35.5Z"/>
        <path class="canto c2" d="M93.5 35.5V6.5H64.5V13.5H86.5V35.5Z"/>
        <path class="canto c3" d="M6.5 64.5V93.5H35.5V86.5H13.5V64.5Z"/>
        <path class="canto c4" d="M93.5 64.5V93.5H64.5V86.5H86.5V64.5Z"/>
        <path class="marca" d="M48.5 22h3v12h-3Z M48.5 66h3v12h-3Z M22 48.5h12v3h-12Z M66 48.5h12v3h-12Z"/>
        <g class="ponto">
          <circle cx="50" cy="50" r="10" fill="#ff5500" opacity=".85" filter="url(#brilho)"/>
          <circle cx="50" cy="50" r="10" fill="#ff5500"/>
        </g>
      </svg>
      <h1 class="titulo"><span data-decodificar data-inicio="1700">Código de </span><em data-decodificar data-inicio="2600">verdade.</em><span class="cursor"></span></h1>
      <p class="rotulo">tirvo_ / hiperfoco</p>
    </div>
    <footer class="rodape">
      <img class="logo" src="../../marca/tirvo-logo.svg" alt="Tirvo">
      <span class="dado">tirvo.tech</span>
    </footer>
  </main>

  <script>
    // Decodificação determinística: o mesmo instante sempre gera o mesmo quadro.
    const SIMBOLOS = '01<>/{}#$%&*+=?';
    const PASSO = 55;       // ms por letra revelada
    const EMBARALHO = 60;   // ms entre trocas de símbolo
    const alvos = [...document.querySelectorAll('[data-decodificar]')].map(el => ({
      el, texto: el.textContent, inicio: Number(el.dataset.inicio),
    }));

    window.tirvoQuadro = t => {
      const troca = Math.floor(t / EMBARALHO);
      for (const { el, texto, inicio } of alvos) {
        if (t < inicio) { el.style.visibility = 'hidden'; continue; }
        el.style.visibility = 'visible';
        const revelados = Math.floor((t - inicio) / PASSO);
        el.textContent = [...texto].map((c, i) => {
          if (i < revelados || c === ' ') return c;
          return SIMBOLOS[(((i + 1) * 73856093 ^ (troca + 1) * 19349663) >>> 0) % SIMBOLOS.length];
        }).join('');
      }
    };

    // Fora da renderização, anima em tempo real para pré-visualizar no navegador.
    if (!navigator.webdriver) {
      const inicio = performance.now();
      const quadro = () => { window.tirvoQuadro(performance.now() - inicio); requestAnimationFrame(quadro); };
      requestAnimationFrame(quadro);
    }
  </script>
</body>
</html>
